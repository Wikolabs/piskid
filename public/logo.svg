<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- iMahay logo — zebu head with curved horns (half-circle) + connected aloalo body -->
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FEF3C7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#halo)"/>

  <!-- Zebu HORNS — smooth half-circle curves sweeping up + outward then inward -->
  <path d="M27 14 C 18 14, 14 8, 18 3"  stroke="url(#bodyGrad)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M37 14 C 46 14, 50 8, 46 3"  stroke="url(#bodyGrad)" stroke-width="2.4" fill="none" stroke-linecap="round"/>

  <!-- Zebu HEAD circle (slightly bigger, touches diamond below) -->
  <circle cx="32" cy="16" r="6" stroke="url(#bodyGrad)" stroke-width="1.8" fill="none"/>
  <!-- Eye dot -->
  <circle cx="32" cy="16" r="1.2" fill="url(#bodyGrad)"/>

  <!-- Diamond carving — touches head bottom (no gap) -->
  <path d="M32 22 L 40 30 L 32 38 L 24 30 Z" stroke="url(#bodyGrad)" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
  <!-- Inner cross -->
  <path d="M32 26 L 32 34 M28 30 L 36 30" stroke="url(#bodyGrad)" stroke-width="1.4"/>

  <!-- Lower medallion -->
  <circle cx="32" cy="44" r="3.5" stroke="url(#bodyGrad)" stroke-width="1.6" fill="none"/>

  <!-- Post -->
  <rect x="29.5" y="48" width="5" height="9" rx="1" stroke="url(#bodyGrad)" stroke-width="1.6" fill="none"/>

  <!-- Base mound -->
  <ellipse cx="32" cy="59" rx="8" ry="1.5" fill="#78350F" opacity="0.5"/>
</svg>
