<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- iMahay — stylized baobab silhouette with Malagasy flag colors -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FEF3C7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#halo)"/>
  <!-- Baobab trunk -->
  <path d="M28 50 L28 36 C 28 34 30 33 32 33 C 34 33 36 34 36 36 L 36 50 Z" fill="url(#grad)"/>
  <!-- Crown branches -->
  <path d="M32 33 C 22 30 16 22 14 14 C 18 18 24 20 28 18 M32 33 C 42 30 48 22 50 14 C 46 18 40 20 36 18 M32 33 C 32 26 28 18 22 10 C 26 14 30 16 32 16 M32 33 C 32 26 36 18 42 10 C 38 14 34 16 32 16"
        stroke="url(#grad)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <!-- Base earth line -->
  <ellipse cx="32" cy="50" rx="14" ry="2.5" fill="#78350F" opacity="0.45"/>
</svg>
