<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- iMahay logo — stylized aloalo with zebu head + horns pointing UP -->
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FEF3C7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#halo)"/>

  <!-- Zebu HORNS — two separate arcs sweeping UP and OUT -->
  <path d="M28 13 Q 22 8 18 3" stroke="url(#bodyGrad)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M36 13 Q 42 8 46 3" stroke="url(#bodyGrad)" stroke-width="2.4" fill="none" stroke-linecap="round"/>

  <!-- Zebu HEAD circle (between the horns base) -->
  <circle cx="32" cy="17" r="5" stroke="url(#bodyGrad)" stroke-width="1.8" fill="none"/>
  <!-- Small eye dot -->
  <circle cx="32" cy="17" r="1" fill="url(#bodyGrad)"/>

  <!-- Diamond carving (aloalo body decoration) -->
  <path d="M32 26 L 40 34 L 32 42 L 24 34 Z" stroke="url(#bodyGrad)" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
  <!-- Inner cross -->
  <path d="M32 30 L 32 38 M28 34 L 36 34" stroke="url(#bodyGrad)" stroke-width="1.4"/>

  <!-- Lower medallion -->
  <circle cx="32" cy="48" r="4" stroke="url(#bodyGrad)" stroke-width="1.6" fill="none"/>

  <!-- Post -->
  <rect x="29.5" y="52" width="5" height="7" rx="1" stroke="url(#bodyGrad)" stroke-width="1.6" fill="none"/>

  <!-- Base mound -->
  <ellipse cx="32" cy="60" rx="8" ry="1.5" fill="#78350F" opacity="0.5"/>
</svg>
