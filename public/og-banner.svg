<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F1"/>
      <stop offset="100%" stop-color="#F5F1E6"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FEF3C7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Side aloalo decorations (zebu head + horns up) -->
  <g transform="translate(80 250) scale(0.85)" opacity="0.10">
    <path d="M28 13 Q 22 8 18 3" stroke="#78350F" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M36 13 Q 42 8 46 3" stroke="#78350F" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <circle cx="32" cy="17" r="5" stroke="#78350F" stroke-width="1.6" fill="none"/>
    <path d="M32 26 L 40 34 L 32 42 L 24 34 Z" stroke="#78350F" stroke-width="1.6" fill="none"/>
    <circle cx="32" cy="52" r="5" stroke="#78350F" stroke-width="1.4" fill="none"/>
    <rect x="29" y="58" width="6" height="48" stroke="#78350F" stroke-width="1.4" fill="none"/>
  </g>
  <g transform="translate(1060 240) scale(0.85)" opacity="0.10">
    <path d="M28 13 Q 22 8 18 3" stroke="#DC2626" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M36 13 Q 42 8 46 3" stroke="#DC2626" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <circle cx="32" cy="17" r="5" stroke="#DC2626" stroke-width="1.6" fill="none"/>
    <path d="M32 26 L 40 34 L 32 42 L 24 34 Z" stroke="#DC2626" stroke-width="1.6" fill="none"/>
    <circle cx="32" cy="52" r="5" stroke="#DC2626" stroke-width="1.4" fill="none"/>
    <rect x="29" y="58" width="6" height="48" stroke="#DC2626" stroke-width="1.4" fill="none"/>
  </g>

  <!-- dust dots -->
  <g opacity="0.5">
    <circle cx="200"  cy="120" r="6" fill="#16A34A"/>
    <circle cx="320"  cy="500" r="5" fill="#DC2626"/>
    <circle cx="900"  cy="100" r="6" fill="#D97706"/>
    <circle cx="980"  cy="540" r="5" fill="#16A34A"/>
    <circle cx="180"  cy="380" r="4" fill="#D97706"/>
    <circle cx="1000" cy="340" r="4" fill="#DC2626"/>
  </g>

  <!-- Central iMahay aloalo logo (zebu head + horns up) -->
  <g transform="translate(540 90)">
    <circle cx="60" cy="60" r="62" fill="url(#glow)"/>
    <g transform="translate(28 18) scale(1.6)">
      <path d="M28 13 Q 22 8 18 3" stroke="url(#bodyGrad)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <path d="M36 13 Q 42 8 46 3" stroke="url(#bodyGrad)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <circle cx="32" cy="17" r="5" stroke="url(#bodyGrad)" stroke-width="1.8" fill="none"/>
      <circle cx="32" cy="17" r="1" fill="url(#bodyGrad)"/>
      <path d="M32 26 L 40 34 L 32 42 L 24 34 Z" stroke="url(#bodyGrad)" stroke-width="1.8" fill="none"/>
      <path d="M32 30 L 32 38 M28 34 L 36 34" stroke="url(#bodyGrad)" stroke-width="1.4"/>
      <circle cx="32" cy="48" r="4" stroke="url(#bodyGrad)" stroke-width="1.6" fill="none"/>
      <rect x="29.5" y="52" width="5" height="7" rx="1" stroke="url(#bodyGrad)" stroke-width="1.6" fill="none"/>
    </g>
  </g>

  <!-- Brand -->
  <text x="600" y="370" font-family="Playfair Display, Georgia, serif" font-size="118" font-weight="700"
        text-anchor="middle" letter-spacing="-2">
    <tspan fill="#14532D">i</tspan><tspan fill="#1A1A1A">Mahay</tspan><tspan fill="#DC2626">.</tspan>
  </text>

  <!-- Tagline -->
  <text x="600" y="440" font-family="Cormorant Garamond, Georgia, serif" font-size="38" font-style="italic"
        text-anchor="middle" fill="#525252">Ny fahendren'ny razana miteny aminao izao.</text>

  <!-- Badge -->
  <g transform="translate(600 510)">
    <rect x="-200" y="-22" width="400" height="44" rx="22" fill="#DCFCE7" stroke="#16A34A" stroke-opacity="0.30" stroke-width="1.2"/>
    <text x="0" y="6" font-family="Playfair Display, Georgia, serif" font-size="15" font-weight="700"
          text-anchor="middle" fill="#14532D" letter-spacing="2.5">ZOKIOLONA · OLO-BE · MANAM-PAHAIZANA</text>
  </g>

  <!-- Bottom verse -->
  <text x="600" y="595" font-family="Cormorant Garamond, Georgia, serif" font-size="20" font-style="italic"
        text-anchor="middle" fill="#737373">« Ny fahalalana mitombo amin'ny fihainoana » — Ohabolana</text>
</svg>
